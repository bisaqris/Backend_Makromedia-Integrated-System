allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  prisma: true

# pnpm 10+ memindahkan `overrides` & sebagian setting ke sini (dulu di package.json).
# Override ini menambal kerentanan pada dependency transitif (hasil `pnpm audit`).
overrides:
  'tmp@<0.2.6': '>=0.2.6'
  'lodash@<4.18.0': '>=4.18.0'
  'glob@>=10.2.0 <10.5.0': '>=10.5.0'
  'js-yaml@>=4.0.0 <4.3.0': '>=4.3.0'
  'js-yaml@>=5.0.0 <5.2.2': '>=5.2.2'
  'webpack@>=5.49.0 <=5.104.0': '>=5.104.1'
  'multer@>=1.0.0 <2.2.0': '>=2.2.0'
  'ajv@>=7.0.0-alpha.0 <8.18.0': '>=8.18.0'
  'file-type@>=13.0.0 <21.3.1': '>=21.3.1'
  'picomatch@>=4.0.0 <4.0.4': '>=4.0.4'
  'qs@>=6.11.1 <=6.15.1': '>=6.15.2'
  'body-parser@<1.20.6': '>=1.20.6'

# Lewati pre-check deps saat menjalankan script (pnpm build/start:dev) agar
# gate build-script Prisma tidak membatalkan run.
verifyDepsBeforeRun: false
